*{box-sizing:border-box;margin:0;padding:0}

.cap{height:190px;padding:46px 28px 0;color:#fff;text-align:center}
.cap h1{font-size:33px;line-height:1.12;font-weight:800;letter-spacing:-.5px}
.cap p{font-size:17px;opacity:.9;margin-top:10px;line-height:1.3}
.phone{position:absolute;left:22px;right:22px;top:212px;height:800px;border-radius:52px;background:#0c0f12;padding:12px}
.scr{width:100%;height:100%;border-radius:42px;overflow:hidden;background:#F4F7FA;position:relative}
.sb{height:50px;display:flex;justify-content:space-between;align-items:center;padding:8px 30px 0;font-weight:600;font-size:15px}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:32px;background:#000;border-radius:20px}
.nav{height:44px;display:flex;align-items:center;justify-content:center;position:relative;font-weight:600;font-size:17px;border-bottom:1px solid #D9E2EA;background:#F8FAFC}
.nav .r{position:absolute;right:16px;color:#1F6FEB;font-weight:400}
.nav .l{position:absolute;left:12px;color:#1F6FEB;font-weight:400}
.pad{padding:14px;display:flex;flex-direction:column;gap:10px}
.card{background:#fff;border:1px solid #D9E2EA;border-radius:12px;padding:13px 14px;display:flex;flex-direction:column;gap:4px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.h1{font-size:23px;font-weight:700}.h2{font-size:17px;font-weight:600}
.body{font-size:15px}.muted{font-size:13px;color:#5B6B78}.b{font-weight:600}
.danger{color:#C62828}.brand{color:#1F6FEB}.ok{color:#2E7D32}
.map{border-radius:12px;overflow:hidden;border:1px solid #D9E2EA}
.btnq{border:1px solid #D9E2EA;border-radius:10px;padding:11px;text-align:center;color:#1F6FEB;font-weight:600;background:#fff;font-size:15px}
.sw{width:46px;height:28px;border-radius:14px;background:#E3E8EE;position:relative}.sw:after{content:'';position:absolute;left:2px;top:2px;width:24px;height:24px;border-radius:12px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw.on{background:#34C759}.sw.on:after{left:20px}
