name = "drivewatch-api"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Runs every 5 minutes to catch phones that go quiet mid-drive.
[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "drivewatch"
database_id = "e679849b-45aa-4671-878c-16837fd4371a"
migrations_dir = "migrations"

[vars]
SUPPORT_EMAIL = "doug@webdesignnerd.com"
